name: Validate Changes

on:
  push:
    branches: [ "main", "yaml-tests" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SLN file
        run: dotnet new sln -n ngradio
      - name: Add dependencies
        run: |
          dotnet sln add Project
          dotnet sln add Tests

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move into Project directory
        run: cd Project
      - name: Build project
        run: dotnet build 
      - name: Lint project
        run: dotnet format

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
