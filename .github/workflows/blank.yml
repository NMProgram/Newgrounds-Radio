# This is a basic workflow to help you get started with Actions

name: Validate Changes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move into Project directory
        run: cd Project
      - name: Build project
        run: dotnet build
      - name: Lint project
        run: dotnet format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
