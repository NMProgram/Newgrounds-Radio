name: Validate Changes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move into Project directory
        run: cd Project
      - name: Add SLN file
        run: dotnet sln add .
      - name: Build project
        run: dotnet build 
      - name: Lint project
        run: dotnet format

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
