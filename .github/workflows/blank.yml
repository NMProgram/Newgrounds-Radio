name: Validate Changes

on:
  push:
    branches: [ "main", "yaml-tests" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: dotnet build Project
      - name: Lint project
        shell: bash
        run: |
          dotnet format Project -v m --verify-no-changes 2> errors.txt
          contents=`cat errors.txt`
          if [ -e errors.txt ]; then
            echo Found Errors:
            echo ""
            echo $contents
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
