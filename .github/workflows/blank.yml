name: Validate Changes

on:
  push:
    branches: [ "main", "yaml-tests" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SLN file
        run: dotnet new sln -n ngradio
      - name: Add dependencies
        run: |
          dotnet sln add Project
          dotnet sln add Tests

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: dotnet build Project
      - name: Lint project
        run: dotnet format Project -v d --verify-no-changes --report errors.json
      - name: Print Errors
        run: |
          contents=`cat errors.json`
          echo Errors: $contents
      # - uses: actions/upload-artifact@v4
      #   with: 
      #     name: errors
      #     path: errors.json
      # - uses: actions/download-artifact@v5
      #   with:
      #     name: errors
      # - name: Print Results
      #   shell: bash
      #   run: |
      #     value=`cat errors.json`
      #     echo Found errors: $value



  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
