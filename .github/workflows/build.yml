name: Build

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: dotnet build Project
      
      - name: Build Tests
        run: dotnet build Tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint projects
        run: |
          dotnet format Project -v m --verify-no-changes 2> errors.txt
          dotnet format Tests -v m --verify-no-changes 2> errors.txt

      - name: Linting Errors
        run: |
          contents=`cat errors.txt`
          echo $contents
        if: ${{failure()}}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Tests
        run: dotnet test Tests
