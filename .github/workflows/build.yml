name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Solution
        run: dotnet build ngradio.slnx

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Solution
        run: dotnet format ngradio.slnx
          -v d 
          --verify-no-changes 
          --report linting.json

      - name: Display Errors
        if: ${{failure()}}
        run: echo `cat linting.json` | python3 -m json.tool

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Tests
        run: dotnet test ngradio.slnx
