name: Build

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Project
        run: dotnet build Project
      
      - name: Build Tests
        run: dotnet build Tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint projects
        run: dotnet format ngradio.slnx 
          -v d 
          --verify-no-changes 
          --report linting.json

      - name: Display Linting Errors
        if: ${{failure()}}
        shell: bash
        run: |
          contents=`cat linting.json`
          echo $contents | python3 -m json.tool

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Tests
        run: dotnet test Tests
