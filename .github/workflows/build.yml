name: Build

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Project
        run: dotnet build Project
      
      - name: Build Tests
        run: dotnet build Tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint projects
        run: |
          dotnet format ngradio.slnx -v d --verify-no-changes --report linting.json

      - uses: actions/upload-artifact@v2
        with:
          name: lint_errors
          path: linting.json

      - uses: actions/download-artifact@v2
        with:
          name: lint_errors

      - name: Linting Errors
        if: ${{failure()}}
        run: cat linting.json

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Tests
        run: dotnet test Tests
